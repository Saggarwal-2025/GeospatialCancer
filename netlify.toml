# Netlify deploy config.
#
# Mirrors what vercel.json does on Vercel and server.js does on GoDaddy: build
# the Vite app, serve dist/, and send every unmatched path to index.html so
# React Router handles /departments, /officers and /contact on a hard refresh.

[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
